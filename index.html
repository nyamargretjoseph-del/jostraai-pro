<!DOCTYPE html>
<html>
<head>
  <title>JostraAI Pro Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f1a;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 2px solid #1f2937;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }

    #status {
      font-size: 1.1em;
      font-weight: bold;
      color: #ff4444;
    }

    #status.connected {
      color: #00ff99;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: #111827;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #1f2937;
    }

    .card h2 {
      font-size: 0.9em;
      color: #9ca3af;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .card p {
      font-size: 1.8em;
      font-weight: bold;
      color: #00ff99;
    }

    .panel {
      background: #111827;
      margin-bottom: 20px;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #1f2937;
    }

    .panel h2 {
      margin-bottom: 15px;
      color: #e5e7eb;
    }

    .analysis-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric {
      background: #0f1419;
      padding: 10px;
      border-radius: 6px;
      border-left: 3px solid #00ff99;
    }

    .metric label {
      font-size: 0.8em;
      color: #9ca3af;
    }

    .metric value {
      font-size: 1.2em;
      font-weight: bold;
      display: block;
      margin-top: 5px;
    }

    #heatmap {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      margin-top: 10px;
    }

    .cell {
      padding: 8px;
      background: #1f2937;
      text-align: center;
      border-radius: 5px;
      font-size: 0.9em;
    }

    .controls {
      text-align: center;
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      background: #1f2937;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }

    button.primary {
      background: #00ff99;
      color: #0b0f1a;
    }

    button.danger {
      background: #ff4444;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🚀 JOSTRAAI PRO DASHBOARD</h1>
    <p id="status">⚪ DISCONNECTED</p>
  </div>

  <div class="grid">

    <div class="card">
      <h2>Live Signal</h2>
      <p id="signal">WAIT ⏳</p>
    </div>

    <div class="card">
      <h2>AI Score</h2>
      <p id="score">--</p>
    </div>

    <div class="card">
      <h2>Market</h2>
      <p>R_25</p>
    </div>

    <div class="card">
      <h2>System</h2>
      <p>READY</p>
    </div>

  </div>

  <div class="panel">
    <h2>📊 Analysis Engine</h2>

    <div class="analysis-row">
      <div class="metric">
        <label>Over / Under</label>
        <value id="ou">--</value>
      </div>

      <div class="metric">
        <label>Even / Odd</label>
        <value id="eo">--</value>
      </div>
    </div>

    <div class="analysis-row">
      <div class="metric">
        <label>Momentum</label>
        <value id="momentum">--</value>
      </div>

      <div class="metric">
        <label>MatchDiffer</label>
        <value id="match">--</value>
      </div>
    </div>

  </div>

  <div class="panel">
    <h2>🔥 Heatmap (0–9)</h2>
    <div id="heatmap"></div>
  </div>

  <div class="controls">
    <button class="primary" onclick="start()">START</button>
    <button class="danger" onclick="stop()">STOP</button>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
